name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check formatting
        run: nix develop --command just fmt-check

      - name: Run clippy
        run: nix develop --command just clippy

      - name: Run tests
        run: nix develop --command just test

      - name: Build feature combinations
        run: nix develop --command just features

      - name: Build documentation
        run: nix develop --command just doc

      - name: Check fuzz target
        run: nix develop --command cargo check --manifest-path fuzz/Cargo.toml
